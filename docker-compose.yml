version: "3.9"

services:
  icecast:
    image: infiniteproject/icecast
    container_name: icecast
    restart: on-failure:5
    ports:
      - "${ICECAST_PORT:-8000}:8000"
    volumes:
      - ./ops/generated/icecast.xml:/etc/icecast.xml:ro
      - ./ops/logs/icecast:/var/log/icecast
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.25'
          memory: 128M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8000/status.xsl"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  liquidsoap:
    image: savonet/liquidsoap:v2.2.5
    container_name: liquidsoap
    restart: on-failure:5
    depends_on:
      icecast:
        condition: service_healthy
    volumes:
      - ./ops/generated/radio.liq:/radio/radio.liq:ro
      - ${MUSIC_ROOT:-./music}:/radio/music:ro
      - ./ops/logs/liquidsoap:/var/log/liquidsoap
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 256M
    environment:
      ICECAST_SOURCE_PASSWORD: ${ICECAST_SOURCE_PASSWORD:?ICECAST_SOURCE_PASSWORD is required}
      ICECAST_ADMIN_PASSWORD: ${ICECAST_ADMIN_PASSWORD:?ICECAST_ADMIN_PASSWORD is required}
      ICECAST_RELAY_PASSWORD: ${ICECAST_RELAY_PASSWORD:?ICECAST_RELAY_PASSWORD is required}
      ICECAST_HOST: ${ICECAST_HOST:-icecast}
      ICECAST_PORT: ${ICECAST_PORT:-8000}
      ICECAST_MOUNT: ${ICECAST_MOUNT:-/stream}
      STREAM_BITRATE_KBPS: ${STREAM_BITRATE_KBPS:-128}
      STATION_NAME: ${STATION_NAME:-Radio Free}
      STATION_DESCRIPTION: ${STATION_DESCRIPTION:-Liquidsoap -> Icecast demo}
    command: ["sh", "-c", "liquidsoap -v /radio/radio.liq || exit 1"]
    healthcheck:
      test: ["CMD", "pgrep", "-f", "liquidsoap"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
